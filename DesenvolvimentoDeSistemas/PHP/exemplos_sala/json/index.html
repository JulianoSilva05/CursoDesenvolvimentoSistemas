<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Exercícios e material de PHP do curso técnico em Desenvolvimento de Sistemas SENAI.">
    <meta name="keywords" content="curso técnico SENAI, desenvolvimento de sistemas, programação, testes de software, banco de dados, PHP, MySQL, IoT, educação profissional, material didático, exercícios">
    <meta name="robots" content="index, follow">
    <link rel="icon" type="image/png" href="../../../../assets/estudando.png">
    <title>Cadastro de Produtos</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header class="cabecalho">
        <h1>Cadastro de Produtos</h1>
        <p>Formulrio para cadastro usando HTML, CSS, PHP e JSON</p>
    </header>
    <main class="container-principal">
        <section class="formulario-box">
            <h2>Novo Produto</h2>
            <form action="salvar.php" method="post" class="formulario">
                <fieldset>
                    <legend>Dados do Produto</legend>
                    <label for="id">ID</label>
                    <input type="number" name="id" id="id" required>
                    <label for="nome">Nome</label>
                    <input type="text" name="nome" id="nome" required>
                    <label for="preco">Preo</label>
                    <input type="number" step="0.01" name="preco" id="preco" required>
                    <label for="codigo_barras">Cdigo de Barras</label>
                    <input type="text" name="codigo_barras" id="codigo_barras" required>
                    <label for="marca">Marca</label>
                    <input type="text" name="marca" id="marca" required>
                    <label for="categoria">Categoria</label>
                    <input type="text" name="categoria" id="categoria" required>
                    <button type="submit">Cadastrar</button>
                </fieldset>
            </form>
        </section>
    </main>
    <footer class="rodape">
        <p>Projeto introdutrio com PHP e JSON</p>
    </footer>
</body>

</html>
