    <header>
        <form action="salvar.php" method="post">
        <main>
            <h1>Cadastro de Produto</h1>
            <h2>
                <label for="nome">Nome do produto:</label>
                <input type="text" id="nome" name="nome" placeholder="Digite o nome do produto...">
               </h2> 
                <br>

                <h3>
                <label for="preco">Preço do produto:</label>
                <input type="double" id="preco" name="preco" placeholder="Digite o preço do produto...">
                </h3>
                <br>
                <h4>
                <label for="codigo_de_barras">Código de barras:</label>

                </h4>

                <br>
                <h5>
                <label for="Marca">Marca do produto:</label>

                <h6>
                <label for="categoria">Categoria do produto:</label>

                </h6>
                <br>
                <h7>
                <label for="matricula">Mátricula:</label>
                <input type="number" id="matricula" name="matricula" placeholder="Digite sua matrícula...">

                <button type="submit">Cadastrar</button>
